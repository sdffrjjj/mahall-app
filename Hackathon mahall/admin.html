<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Access Gateway | Noorul Huda Mahall</title>
  <link rel="icon" type="image/jpeg" href="assets/images/mahall_logo.jpg" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 selection:bg-amber-500 selection:text-slate-950 relative overflow-hidden">

  <!-- Background decorative glows -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl text-center space-y-6">

    <!-- Brand Logo & Header -->
    <div class="flex flex-col items-center space-y-3">
      <div class="relative group">
        <div class="absolute -inset-1 bg-gradient-to-r from-emerald-500 to-amber-500 rounded-full blur opacity-70 group-hover:opacity-100 transition duration-300"></div>
        <img src="assets/images/mahall_logo.jpg" alt="Noorul Huda Mahall Logo" class="relative w-20 h-20 rounded-full object-cover border-2 border-slate-800 shadow-xl" />
      </div>
      <div>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/20">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Executive Secretariat
        </span>
        <h1 class="text-2xl font-black tracking-tight text-white mt-2 font-heading">
          Admin Portal Gateway
        </h1>
        <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">
          Protected Administrative Console & Program Registrations Management
        </p>
      </div>
    </div>

    <!-- Live Auth Verification Status -->
    <div id="admin-auth-status-card" class="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-left text-xs space-y-2">
      <div class="flex items-center justify-between text-slate-400 text-[11px]">
        <span>Security Check:</span>
        <span id="admin-status-badge" class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-mono text-[10px]">Verifying...</span>
      </div>
      <div id="admin-status-details" class="text-slate-300 text-xs">
        Checking Firestore administrative credentials...
      </div>
    </div>

    <!-- Alert Box -->
    <div id="admin-alert" class="hidden p-3 rounded-xl text-xs font-semibold text-left"></div>

    <!-- PRIMARY ACTION AREA: Dynamic based on real authorization -->
    <div id="admin-action-container" class="space-y-3">
      <!-- Injected dynamically: either Launch button or Admin Passkey sign in -->
    </div>

    <!-- Direct manual link & Back to website -->
    <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
      <a href="index.html" class="text-slate-400 hover:text-white flex items-center gap-1 transition">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Public Website
      </a>
      <a href="login.html" class="text-amber-400 hover:text-amber-300 font-semibold underline underline-offset-4 flex items-center gap-1">
        Login Portal <i data-lucide="external-link" class="w-3 h-3"></i>
      </a>
    </div>

  </div>

  <!-- Official Google Firebase SDK Compatibility (v10.8.0) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function renderAdminGatewayUI() {
      const container = document.getElementById('admin-action-container');
      const badge = document.getElementById('admin-status-badge');
      const details = document.getElementById('admin-status-details');
      const alertBox = document.getElementById('admin-alert');

      const isAuthed = AuthService.isAuthenticated();
      const isAdmin = AuthService.isAdmin();
      const user = AuthService.getCurrentUser();

      if (isAdmin) {
        badge.textContent = 'AUTHORIZED ADMIN';
        badge.className = 'px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-800 font-mono text-[10px] font-bold';
        details.innerHTML = `
          Signed in as: <strong class="text-white">${user.name}</strong><br>
          <span class="font-mono text-amber-400 text-[11px]">Role: ADMIN • UID: ${user.uid}</span>
        `;

        container.innerHTML = `
          <a href="ADMIN/index.html" class="w-full group relative flex items-center justify-center gap-3 py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-500 via-amber-400 to-emerald-500 text-slate-950 font-black text-sm shadow-xl hover:shadow-amber-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
            <i data-lucide="shield-check" class="w-5 h-5 text-slate-950 transition-transform group-hover:rotate-12"></i>
            <span class="tracking-wide">OPEN EXECUTIVE ADMIN PORTAL</span>
            <i data-lucide="arrow-right" class="w-4 h-4 text-slate-950 transition-transform group-hover:translate-x-1"></i>
          </a>
          <button onclick="AuthService.logout()" class="w-full py-2 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">
            Sign Out of Administrator Session
          </button>
        `;
      } else if (isAuthed && !isAdmin) {
        badge.textContent = 'ACCESS DENIED';
        badge.className = 'px-2 py-0.5 rounded-full bg-rose-950 text-rose-300 border border-rose-800 font-mono text-[10px] font-bold';
        details.innerHTML = `
          Signed in as: <strong class="text-white">${user.name}</strong> (${user.username || user.uid})<br>
          <span class="font-mono text-rose-400 text-[11px]">Assigned Role: ${AuthService.getCurrentRole().toUpperCase()}</span>
        `;

        container.innerHTML = `
          <div class="p-3.5 rounded-xl bg-rose-950/40 border border-rose-800 text-rose-300 text-xs text-left space-y-1">
            <strong>Unauthorized for Admin Portal:</strong> Normal user accounts cannot access administrative command registers.
          </div>
          <a href="my-mahall.html" class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Return to My Resident Dashboard
          </a>
          <a href="login.html" class="w-full flex items-center justify-center gap-2 py-2 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">
            Switch to Administrator Account
          </a>
        `;
      } else {
        badge.textContent = 'NOT SIGNED IN';
        badge.className = 'px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono text-[10px]';
        details.innerHTML = `Administrative credentials required. Enter passkey or sign in.`;

        container.innerHTML = `
          <form onsubmit="handleDirectAdminSignIn(event)" class="space-y-3">
            <div class="relative">
              <input type="password" id="gateway-admin-pass" placeholder="Enter Admin Passkey (admin2026)" value="admin2026"
                class="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 font-mono focus:outline-none" />
            </div>
            <button type="submit" class="w-full flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow-lg transition active:scale-[0.98]">
              <i data-lucide="key" class="w-4 h-4"></i>
              <span>AUTHENTICATE AS SECRETARY</span>
            </button>
          </form>
          <a href="login.html?tab=admin" class="block text-xs text-slate-400 hover:text-white transition">
            Open Advanced Login Center &rarr;
          </a>
        `;
      }

      if (window.lucide) lucide.createIcons();
    }

    async function handleDirectAdminSignIn(e) {
      e.preventDefault();
      const pass = (document.getElementById('gateway-admin-pass')?.value || '').trim();
      const alertBox = document.getElementById('admin-alert');

      try {
        await AuthService.login('admin@mahall.org', pass);
        if (alertBox) {
          alertBox.className = 'p-3 rounded-xl text-xs font-semibold bg-emerald-950/80 text-emerald-300 border border-emerald-800';
          alertBox.textContent = 'Clearance verified! Launching Executive Portal...';
          alertBox.classList.remove('hidden');
        }
        setTimeout(() => {
          window.location.href = 'ADMIN/index.html';
        }, 600);
      } catch (err) {
        if (alertBox) {
          alertBox.className = 'p-3 rounded-xl text-xs font-semibold bg-rose-950/80 text-rose-300 border border-rose-800';
          alertBox.textContent = err.message || 'Invalid administrative credentials.';
          alertBox.classList.remove('hidden');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      AuthService.onAuthStateChanged(() => {
        renderAdminGatewayUI();
      });
    });
  </script>
</body>

</html>
